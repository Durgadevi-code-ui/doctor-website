<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Agentic Atoms</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-auth-body">
  <main class="admin-auth-card" role="main">
    <div class="logo-row admin-auth-logo">
      <div class="logo-placeholder atom-logo" aria-hidden="true">
      <img src="{{ url_for('static', filename='images/agentic-atoms-mark.png') }}" alt="" class="logo-img">
    </div>
      <div class="brand-mark">Agentic<span>Atoms</span></div>
    </div>
    <h1>Admin Login</h1>
    <p class="admin-auth-sub">Sign in to view and manage submitted customer records.</p>

    {% if error %}
      <div class="banner show error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('admin.login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit-btn">Continue</button>
    </form>
    <p class="admin-auth-note">Protected by two-factor authentication. A verification code will be emailed to the account on file after your password is confirmed.</p>
  </main>
</body>
</html>
